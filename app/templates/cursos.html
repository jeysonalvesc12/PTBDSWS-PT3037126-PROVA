{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
<div>
    {{ wtf.quick_form(form) }}
</div>

<h2>Relação de cursos cadastrados</h2>

<table class="table">
    <thead>
        <tr>
            <th>Curso</th>
            <th>Descrição</th>
        </tr>
    </thead>
    <tbody>
        {% for curso in cursos %}
        <tr>
            <td><strong>{{ curso.nome }}</strong></td>
            <td>{{ curso.descricao }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
